<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG image template, 1200 by 630</title>
  <style>
    html { color-scheme: light; }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 16px;
      background: #0f5c5c;
    }
    .copy {
      position: absolute;
      left: 72px;
      right: 64px;
      top: 50%;
      transform: translateY(-50%);
    }
    h1 {
      margin: 0 0 28px;
      font-size: 72px;
      line-height: 1.05;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
      max-width: 980px;
      font-size: 36px;
      line-height: 1.35;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="bar" aria-hidden="true"></div>
  <div class="copy">
    <h1>Joseph Kim</h1>
    <p>Founder-operator turning AI capabilities into deployed products and workflows.</p>
  </div>
</body>
</html>
